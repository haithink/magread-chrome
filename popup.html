<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 12px/1.6 "Microsoft YaHei UI", sans-serif; width: 400px; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 14px; color: #1b4b43; margin: 0 0 10px; }
    .hint { color: #8a9a94; font-size: 11px; margin: 6px 0; }
    .row { margin-bottom: 8px; }
    label { display: block; font-weight: 600; margin-bottom: 2px; }
    input, select { width: 100%; box-sizing: border-box; padding: 5px 8px; border: 1px solid #ccd; border-radius: 6px; font: 12px "Microsoft YaHei UI", sans-serif; }
    .btns { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
    button { background: #1b4b43; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font: 600 12px "Microsoft YaHei UI", sans-serif; cursor: pointer; }
    button:hover { background: #266356; }
    button.gray { background: #7a8a86; }
    .status { min-height: 18px; font-size: 11px; color: #5c7f10; word-break: break-all; }
    .status.err { color: #b00020; }
    #llmList { border: 1px solid #dde; border-radius: 6px; min-height: 54px; max-height: 130px; overflow: auto; margin-bottom: 6px; }
    #llmList div { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #eef2ee; }
    #llmList div:hover { background: #f0f6ee; }
    #llmList div.sel { background: #e2efe6; }
    textarea { width: 100%; box-sizing: border-box; height: 64px; border: 1px solid #ccd; border-radius: 6px; font: 11px "Microsoft YaHei UI", sans-serif; }
    .sep { border-top: 1px solid #e2e8e2; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>刊读助手 · LLM 设置</h1>
  <div class="hint">配置多个 LLM，★ 为默认；生成失败时可换用其他配置重试。</div>

  <div class="row">
    <label>已配置</label>
    <div id="llmList"></div>
    <div class="btns">
      <button id="bDefault">设为默认 ★</button>
      <button id="bDel" class="gray">删除</button>
    </div>
  </div>

  <div class="sep"></div>
  <div class="row">
    <label>配置名称</label>
    <input id="fName" placeholder="如：deepseek-flash" />
  </div>
  <div class="row">
    <label>接口类型</label>
    <select id="fProvider">
      <option value="openai">OpenAI 兼容（/chat/completions）</option>
      <option value="anthropic">Anthropic 原生（/v1/messages）</option>
    </select>
  </div>
  <div class="row"><label>API 地址 Base URL</label><input id="fUrl" placeholder="https://api.example.com" /></div>
  <div class="row"><label>API Key</label><input id="fKey" type="password" /></div>
  <div class="row"><label>模型名 Model</label><input id="fModel" placeholder="deepseek-chat / gpt-4o …" /></div>

  <div class="row">
    <label>从 cc-switch JSON 粘贴</label>
    <textarea id="fPaste" placeholder='粘贴含 ANTHROPIC_BASE_URL / baseUrl 等字段的 JSON，自动识别'></textarea>
    <div class="btns">
      <button id="bParse" class="gray">解析并填入</button>
      <button id="bModels" class="gray">获取可用模型</button>
      <button id="bTest" class="gray">测试连接</button>
      <button id="bSave">保存此配置</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="sep"></div>
  <div class="row">
    <label>运行日志（最近 300 条）</label>
    <div class="btns">
      <button id="bLogs" class="gray">查看/刷新日志</button>
      <button id="bCopyLogs" class="gray">复制日志</button>
      <button id="bClearLogs" class="gray">清空</button>
    </div>
    <pre id="logBox" style="display:none; max-height:180px; overflow:auto; background:#f4f6f5; padding:6px; border-radius:6px; font:10px Consolas, monospace;"></pre>
  </div>

  <div class="hint">使用：打开英文文章网页 → 点右下角「刊读」悬浮球 → 生成摘要/生词表；双击句子或选中文字点「解析」看句解。</div>

  <script src="popup.js"></script>
</body>
</html>
