<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { font: 12px/1.7 "Segoe UI", "Microsoft YaHei UI", sans-serif; width: 440px; margin: 0; padding: 22px; color: #3c5347; background: #faf9f5; }
    h1 { font-size: 21px; color: #20574e; margin: 0 0 3px; }
    .eyebrow { font-size: 10px; letter-spacing: 2px; color: #a58c56; margin-bottom: 6px; }
    .hint { color: #84917f; font-size: 11px; margin: 6px 0 15px; }
    .row { margin-bottom: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #52694f; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #dce2d5; border-radius: 8px; font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #415a48; background: #fffefa; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #a4bf9e; outline-offset: 1px; }
    .btns { display: flex; gap: 7px; margin: 11px 0; flex-wrap: wrap; }
    button { background: #20574e; color: #fffdf6; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font: 600 12px "Microsoft YaHei UI", sans-serif; cursor: pointer; }
    button:hover { background: #2b6a5a; }
    button.gray { background: #edf1e8; border-color: #dce4d4; color: #617852; }
    button.gray:hover { background: #e1e9d9; }
    .status { min-height: 20px; font-size: 12px; color: #597e43; overflow-wrap: anywhere; }
    .status.err { color: #ae5b48; }
    #llmList { border: 1px solid #dfe5d8; border-radius: 10px; min-height: 54px; max-height: 140px; overflow: auto; background: #fffefa; }
    #llmList div { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #edf0e6; overflow-wrap: anywhere; }
    #llmList div:hover { background: #f0f5eb; }
    #llmList div.sel { background: #e7efdf; box-shadow: inset 3px 0 #7d9d68; }
    textarea { height: 70px; resize: vertical; }
    .sep { border-top: 1px solid #e1e6d9; margin: 20px 0; }
    details { padding: 13px; border: 1px solid #e0e6d7; border-radius: 10px; background: #f2f5ed; margin-bottom: 15px; }
    summary { cursor: pointer; color: #657e54; font-weight: 600; margin-bottom: 8px; }
    #logBox { max-height: 200px; overflow: auto; background: #edf2e8; padding: 12px; border-radius: 8px; font: 11px/1.8 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="eyebrow">KANDU · READING COMPANION</div>
  <h1>阅读助手设置</h1>
  <div class="hint">选择你的阅读模型。★ 为默认配置，点击列表即可编辑。</div>

  <div class="row">
    <label>已配置</label>
    <div id="llmList"></div>
    <div class="btns">
      <button id="bNew" class="gray">新增配置</button>
      <button id="bDefault">设为默认 ★</button>
      <button id="bDel" class="gray">删除</button>
    </div>
  </div>

  <div class="sep"></div>
  <div class="row">
    <label>配置名称</label>
    <input id="fName" placeholder="如：deepseek-flash" />
  </div>
  <div class="row">
    <label>接口类型</label>
    <select id="fProvider">
      <option value="openai">OpenAI 兼容（/chat/completions）</option>
      <option value="anthropic">Anthropic 原生（/v1/messages）</option>
    </select>
  </div>
  <div class="row"><label>API 地址 Base URL</label><input id="fUrl" placeholder="https://api.example.com" /></div>
  <div class="row"><label>API Key</label><input id="fKey" type="password" /></div>
  <div class="row"><label>模型名 Model</label><input id="fModel" placeholder="deepseek-chat / gpt-4o …" /></div>

  <div class="row">
    <details><summary>从 cc-switch JSON 导入配置</summary>
    <textarea id="fPaste" placeholder='粘贴含 ANTHROPIC_BASE_URL / baseUrl 等字段的 JSON，自动识别'></textarea>
    <div class="btns">
      <button id="bParse" class="gray">解析并填入</button>
    </div></details>
    <div class="btns">
      <button id="bModels" class="gray">获取可用模型</button>
      <button id="bTest" class="gray">测试连接</button>
      <button id="bSave">保存此配置</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="sep"></div>
  <div class="row">
    <label>运行日志（最近 300 条）</label>
    <div class="btns">
      <button id="bLogs" class="gray">查看/刷新日志</button>
      <button id="bCopyLogs" class="gray">复制日志</button>
      <button id="bClearLogs" class="gray">清空</button>
    </div>
    <pre id="logBox" style="display:none;"></pre>
  </div>

  <div class="hint">使用：打开英文文章网页 → 点右下角「刊读」悬浮球 → 生成摘要/生词表；双击句子或选中文字点「解析」看句解。</div>

  <script src="popup.js"></script>
</body>
</html>
